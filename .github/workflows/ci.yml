name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valider les skills
        run: python3 scripts/validate_skills.py
      - name: Lint du script d'installation
        run: shellcheck scripts/install.sh
      - name: Vérifier la syntaxe des scripts Python
        run: python3 -m py_compile skills/*/scripts/*.py scripts/*.py
